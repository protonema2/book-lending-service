services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lending
      POSTGRES_USER: lending
      POSTGRES_PASSWORD: lending
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lending -d lending"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    image: book-lending-service:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/lending
      SPRING_DATASOURCE_USERNAME: lending
      SPRING_DATASOURCE_PASSWORD: lending
      # Borrowing rules: change here (or in your shell) without touching code or data
      LIBRARY_LOAN_MAX_ACTIVE_LOANS: ${LIBRARY_LOAN_MAX_ACTIVE_LOANS:-3}
      LIBRARY_LOAN_DURATION: ${LIBRARY_LOAN_DURATION:-14d}
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s

volumes:
  pgdata:
